name: Build Jembatan Dapodik

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'dapodik-jembatan/jembatan.mjs'
      - 'dapodik-jembatan/builder/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Windows executable
        run: node dapodik-jembatan/builder/build.js win

      - name: Build macOS executable
        run: node dapodik-jembatan/builder/build.js mac

      - name: Build Linux executable
        run: node dapodik-jembatan/builder/build.js linux

      - name: Smoke test Linux binary (server mode)
        run: |
          chmod +x dapodik-jembatan/dist/Jembatan-Dapodik-linux
          JEMBATAN_NO_BROWSER=1 JEMBATAN_PORT=48347 ./dapodik-jembatan/dist/Jembatan-Dapodik-linux > /tmp/jembatan.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:48347/api/config > /dev/null && break
            sleep 1
          done
          curl -fs http://127.0.0.1:48347/api/config | grep -q '"cmsUrl"'
          kill $PID
          cat /tmp/jembatan.log

      - name: Smoke test CLI subcommand
        run: |
          dapodik-jembatan/dist/Jembatan-Dapodik-linux --help | grep -q "sync"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jembatan-dapodik-binaries
          path: |
            dapodik-jembatan/dist/Jembatan-Dapodik.exe
            dapodik-jembatan/dist/Jembatan-Dapodik-macos
            dapodik-jembatan/dist/Jembatan-Dapodik-linux
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dapodik-jembatan/dist/Jembatan-Dapodik.exe
            dapodik-jembatan/dist/Jembatan-Dapodik-macos
            dapodik-jembatan/dist/Jembatan-Dapodik-linux
          body: |
            ## Download Jembatan Dapodik

            Download file yang sesuai dengan sistem operasi Anda:

            | Platform | File | Cara Pakai |
            |----------|------|------------|
            | Windows | `Jembatan-Dapodik.exe` | Double-click untuk jalankan |
            | macOS | `Jembatan-Dapodik-macos` | `chmod +x` lalu jalankan |
            | Linux | `Jembatan-Dapodik-linux` | `chmod +x` lalu jalankan |

            Setiap file mendukung mode browser (double-click) dan mode CLI:
            `Jembatan-Dapodik.exe test | preview | sync | config`

            ## Panduan Penggunaan

            Lihat [README-OPERATOR.md](dapodik-jembatan/README-OPERATOR.md) untuk panduan lengkap.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}