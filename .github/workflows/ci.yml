name: CI

on:
  push:
    branches:
      - main
      # Gate juga berjalan pada push cabang feature — selama ini, gate CI
      # hanya menyala via pull_request; push cabang biasa (arena/*, perf/*)
      # tidak memicu apa pun sehingga kerusakan bisa menumpuk diam-diam
      # sebelum PR dibuka. Pola disengaja (bukan "**"): hanya keluarga
      # cabang feature yang nyata di repo ini (arena/* = worktree agen,
      # perf/*, merge-pr/*) yang dilarikan; PR tetap sumber kebenaran
      # untuk merge. Menit Actions gratis untuk repo publik, jadi ini
      # tidak menghabiskan kuota.
      - "arena/**"
      - "perf/**"
      - "merge-pr/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nilai tail log e2e — SATU definisi di level workflow agar step "Run E2E
# tests" DAN step "Check tail heading matches E2E_TAIL_LINES" memakai nilai
# yang sama (env step hanya terlihat di step itu sendiri; check heading butuh
# nilai yang sama untuk memvalidasi heading step summary). Ubah di sini saja.
env:
  # 200 baris stdout (2× default 100) agar stall cold-compile Turbopack +
  # query prisma di sekitarnya selalu terlihat penuh di konsol.
  E2E_TAIL_LINES: 200
  # 100 baris stderr (default 15) agar error context / stack trace
  # (deprecation, Prisma, Next dev overlay) terekam DALAM — tidak ada konteks
  # yang hilang.
  E2E_TAIL_LINES_ERR: 100
  # Masa simpan artifact (hari) — SATU definisi di level workflow, dipakai
  # upload steps (retention-days) DAN teks komentar PR (env di step comment)
  # agar tidak ada drift antara nilai YAML dan teks yang ditampilkan.
  # server-log bertahan LEBIH LAMA (jejak post-mortem), report lebih pendek
  # (file besar, jarang dibuka).
  ARTIFACT_RETENTION_SERVER_LOG: 30
  ARTIFACT_RETENTION_REPORT: 7

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    # Dua service Postgres untuk step "Check schema/migrations drift":
    # postgres (DB "ci_dummy" — juga dipakai PrismaClient build-time) dan
    # postgres-shadow (DB "shadow_ci" kosong untuk `prisma migrate diff`).
    # Dua kontainer, bukan satu, supaya diff tidak menyentuh DB utama job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # PrismaClient membaca DATABASE_URL saat konstruksi (sitemap.ts
      # di-prerender saat build). Test unit memakai mock penuh, jadi DB
      # dummy cukup — tidak ada koneksi nyata yang dibutuhkan (query
      # prerender gagal tertangani try/catch di sitemap). Skema tunggal
      # PostgreSQL — dummy URL harus berprotokol postgresql://. Sejak
      # drift check, DB ini BENAR-BENAR ADA (service postgres di atas) dan
      # dipakai step drift; test unit tetap full-mock (tidak menyentuh DB).
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public"
      # Shadow DB untuk prisma migrate diff — kosong tanpa tabel; script
      # check-schema-migrations yang menerapkan migrasi ke sana. Umur =
      # umur job (kontainer mati bersama runner).
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5433/shadow_ci"
      # AUTH_SECRET tidak wajib saat build, tapi diset untuk menghindari
      # peringatan dari src/lib/auth.ts. Ganti dengan secret asli di
      # production (jangan pernah commit secret di sini).
      AUTH_SECRET: "ci-insecure-build-secret"
      NEXT_PUBLIC_SITE_URL: "https://sdn-mongisidi1.sch.id"
    steps:
      # Checkout WAJIB sebagai step pertama sebelum action lokal —
      # runner me-resolve path ./.github/actions/* dari workspace yang
      # masih kosong tanpa checkout (bug refactor c92ca77: job gagal
      # instan "Can't find 'action.yml' under setup-repo").
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repo (Node + Bun + install)
        uses: ./.github/actions/setup-repo

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Lint (Markdown)
        run: bun run lint:md

      # (Check schema sync DIHAPUS 2026-08-28 — skema tunggal PostgreSQL,
      # tidak ada lagi pasangan schema.prisma/schema.postgres.prisma yang
      # perlu dijaga sinkron. Step drift di bawah adalah check BERBEDA:
      # keselarasan RIWAYAT MIGRASI vs schema.prisma.)

      # Drift guard: `prisma migrate deploy` (deploy-vercel.yml, entrypoint
      # Docker) membangun skema dari FILE migrasi, sedangkan `prisma db
      # push` mengubah DB tanpa mencatat migrasi — selisih keduanya membuat
      # database fresh mendapat skema yang salah (kasus nyata 2026-09-08:
      # migrasi tertinggal 519 baris, login P2022 di DB fresh). Step ini
      # menjalankan prisma migrate diff migrasi→schema dan GAGAL bila
      # tidak kosong; lihat scripts/check-schema-migrations.ts.
      - name: Check schema/migrations drift
        run: bun run check:schema-migrations

      # Guard klasifikasi scope publik (public-scope.test.ts): setiap kolom
      # model Teacher/OrgStructure harus terklasifikasi sadar (daftar PUTIH
      # publik ATAU OMIT), kolom identitas NUPTK/NIP/NIK wajib di-omit, dan
      # omit tidak boleh memuat kolom tak dikenal. Step TERPISAH dari unit
      # suite agar penambahan kolom schema yang belum diklasifikasikan GAGAL
      # CEPAT dengan nama step yang jelas (bukan terkubur di test unit umum).
      - name: Check public-scope classification
        run: bun run check:public-scope

      - name: Test (unit)
        run: bun run test

      - name: Build
        run: bun run build

  # ── Docker image gate ────────────────────────────────────────────────────────
  # Membangun image produksi (Dockerfile) + smoke boot pada setiap PR & push
  # main — jalur deploy self-host (docker compose up → entrypoint `prisma
  # migrate deploy` → server) digate sama seperti jalur Vercel (job validate
  # + deploy-vercel.yml). Tanpa job ini, Dockerfile bisa rusak di PR tanpa
  # ada yang menyadarinya sampai deployment self-host berikutnya.
  #
  # Smoke boot membuktikan per PERILAKU (bukan sekadar image terkompilasi):
  #   1. entrypoint menjalankan `prisma migrate deploy` di DB KOSONG
  #      (service postgres di atas) — seluruh migrasi masuk tanpa gagal;
  #   2. server produksi (node server.js, output standalone) listen di :3000;
  #   3. /api/health 200 dengan checks.db ok (DB nyata, bukan mock).
  # Tag memakai github.run_id — unik per run, tak perlu tahu nomor PR.
  docker-build:
    name: Docker build, boot smoke & publish
    runs-on: ubuntu-latest
    # packages:write — push image ke GHCR saat push ke main (tag sha + latest).
    # PR/push cabang lain hanya build + smoke, TIDAK push.
    permissions:
      contents: read
      packages: write
    # Service postgres untuk smoke boot — DB "docker_smoke" sengaja KOSONG:
    # entrypoint container membangun skema dari nol via `prisma migrate
    # deploy` (persis jalur produksi self-host pada boot pertama).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docker_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache GHA: layer deps (bun install + prisma generate) dan build
      # Next di-cache antar run — build ulang hanya mengompilasi layer yang
      # berubah, bukan dari nol. mode=max agar layer stage builder ikut
      # tersimpan (bukan hanya layer terakhir).
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cms-monsa:ci-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --network host: container app memakai jaringan host runner (pola
      # sama dengan job orphan-check — pg_dump via 127.0.0.1), sehingga
      # DATABASE_URL menunjuk service postgres job ini, bukan ke dalam
      # container app sendiri.
      - name: Boot container against fresh DB (entrypoint migrate)
        run: |
          docker run -d --name monsa-smoke --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/docker_smoke?schema=public" \
            -e AUTH_SECRET="ci-insecure-smoke-secret" \
            cms-monsa:ci-${{ github.run_id }}

      # Sehat = migrate deploy sukses + server standalone listen + health
      # 200 dengan checks.db ok (route health mem-query DB nyata dan 503
      # bila gagal). Poll 120 detik — start-period healthcheck image 60s.
      - name: Smoke — wait for /api/health healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"healthy"'; then
              echo "Container healthy setelah ~$((i * 2)) detik."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container tidak healthy dalam 120 detik — log di bawah."
          docker logs monsa-smoke
          exit 1

      # Bukti migrate path dari SISI DATABASE (bukan hanya health): skema
      # dibangun oleh entrypoint `prisma migrate deploy`, bukan db push —
      #   1. ada migrasi yang diterapkan (entrypoint benar-benar jalan);
      #   2. tidak ada migrasi gagal / di-rollback;
      #   3. tabel User punya kolom mustChangePassword — REGRESI drift
      #      2026-09-08: kolom ini hilang di DB hasil migrate deploy sehingga
      #      login error P2022. Hilang lagi = gate ini merah sebelum deploy.
      - name: Smoke — verify migrate deploy result via psql
        run: |
          psqlq() {
            docker run --rm --network host -e PGPASSWORD=postgres postgres:16-alpine \
              psql -h 127.0.0.1 -U postgres -d docker_smoke -tAc "$1"
          }
          FAIL=0
          TOTAL=$(psqlq "select count(*) from \"_prisma_migrations\"")
          FAILED=$(psqlq "select count(*) from \"_prisma_migrations\" where finished_at is null or rolled_back_at is not null")
          USERCOL=$(psqlq "select count(*) from information_schema.columns where table_name='User' and column_name='mustChangePassword'")
          TOTAL=${TOTAL:-0}; FAILED=${FAILED:-"?"}; USERCOL=${USERCOL:-0}
          if [ "$TOTAL" -ge 1 ]; then
            echo "✓ migrate deploy diterapkan ($TOTAL migrasi)."
          else
            echo "::error::Tidak ada migrasi diterapkan — entrypoint tidak jalan? Log:"; docker logs monsa-smoke; FAIL=1
          fi
          if [ "$FAILED" = 0 ]; then
            echo "✓ tidak ada migrasi gagal/rollback."
          else
            echo "::error::$FAILED migrasi gagal/rollback di _prisma_migrations."; FAIL=1
          fi
          if [ "$USERCOL" -eq 1 ]; then
            echo "✓ kolom mustChangePassword ada di tabel User."
          else
            echo "::error::Kolom mustChangePassword hilang di User — drift migrations↔schema (kasus 2026-09-08) kembali terjadi."; FAIL=1
          fi
          exit $FAIL

      - name: Dump container logs on failure
        if: failure()
        run: docker logs monsa-smoke

      - name: Remove smoke container
        if: always()
        run: docker rm -f monsa-smoke

      # ── Publikasi GHCR (hanya push ke refs/heads/main) ────────────────
      # Image yang di-push = PERSIS image yang lulus boot smoke di atas:
      # tag lokal di-rename lalu di-push, bukan build ulang — jadi yang
      # masuk registry dijamin sudah melewati migrate deploy + health 200
      # + assert psql. PR & push cabang lain tidak menyentuh registry.
      - name: Compute GHCR image name (harus lowercase)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image
        run: echo "name=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR (sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          LOCAL="cms-monsa:ci-${{ github.run_id }}"
          docker tag "$LOCAL" "$IMAGE:sha-${{ github.sha }}"
          docker tag "$LOCAL" "$IMAGE:latest"
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "✓ Ter-push: $IMAGE:sha-${{ github.sha }} dan $IMAGE:latest"

  # ── Self-host E2E penuh (compose up → assert → teardown) ─────────────
  # Membuktikan stack Docker self-host (app + postgres + cron per-menit)
  # benar-benar bekerja end-to-end di setiap PR: image produksi dibangun,
  # entrypoint menjalankan migrate deploy, ketiga cron job (cleanup,
  # storage-alert, backup) terbukti memukul endpoint app dan menulis
  # hasilnya (assert via scripts/e2e-selfhost-assert.ts). Menggunakan
  # cache GHA yang sama dengan job docker-build agar build murah.
  selfhost-e2e:
    name: Self-host E2E (compose up → assert → teardown)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repo (Node + Bun + install)
        uses: ./.github/actions/setup-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image cms-monsa:e2e dengan cache GHA — sama namespace cache
      # dengan job docker-build, jadi layer deps & Next build di-reuse.
      - name: Build image for E2E stack
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cms-monsa:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Orchestrator melakukan preflight (port bebas, tanpa clash), compose
      # up project monsa-e2e, poll health, jalankan assert script, dan
      # teardown down -v selalu. E2E_SKIP_BUILD=1 — image sudah dibangun
      # di atas dengan cache.
      - name: Run self-host E2E (up → assert → teardown)
        run: bun run e2e:selfhost
        env:
          E2E_SKIP_BUILD: "1"

      - name: Dump compose ps on failure
        if: failure()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}'

  # Gate pre-commit EXACT — SUMBER TUNGGAL di hooks-gate.yml (reusable
  # workflow, dipakai juga playwright.yml) supaya tidak ada drift antara
  # pengalaman developer (pre-commit) dan CI sebelum merge.
  hooks-gate:
    uses: ./.github/workflows/hooks-gate.yml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # pull-requests: write diperlukan untuk komentar link artifact di PR saat
    # e2e gagal (lihat step "Comment failure links on PR").
    permissions:
      contents: read
      pull-requests: write
    # PostgreSQL service container — skema tunggal PostgreSQL; e2e butuh DB
    # nyata berisi seed (admin/operator/guru, berita, pengumuman, agenda).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DB e2e: service container postgres di atas (bukan secret — data CI
      # sekali pakai). db:push cukup untuk database baru per run.
      # 127.0.0.1 (bukan localhost) — Node 17+ resolve localhost ke ::1
      # dulu; service container Postgres hanya listen IPv4 → Prisma di
      # proses Next.js 500 "Can't reach database server".
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ci_e2e?schema=public"
      AUTH_SECRET: "ci-insecure-build-secret"
      # Cron routes menolak (503) bila CRON_SECRET kosong — dengan secret,
      # warmup GET tanpa header menghasilkan 401 (bukan 5xx) sehingga gate
      # check:server-log tetap bersih; tanpa ini ia selalu gagal di CI.
      CRON_SECRET: "ci-insecure-cron-secret"
      NEXT_PUBLIC_SITE_URL: "https://sdn-mongisidi1.sch.id"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      # Checkout WAJIB sebagai step pertama sebelum action lokal —
      # runner me-resolve path ./.github/actions/* dari workspace yang
      # masih kosong tanpa checkout (bug refactor c92ca77: job gagal
      # instan "Can't find 'action.yml' under setup-repo").
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repo (Node + Bun + install)
        uses: ./.github/actions/setup-repo

      - name: Setup database (schema)
        run: |
          bun run db:push

      # Database CI kosong (db:push hanya schema) — seed pengguna & konten
      # dasar yang diasumsikan suite (kredensial = e2e/helpers.ts). Seed
      # berpengaman ganda (E2E_SEED=1 + penolakan host Neon) dan idempoten.
      - name: Seed E2E data
        run: E2E_SEED=1 bun run db:seed:e2e

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Production build — suite dijalankan terhadap server produksi
      # (next start), bukan dev mode, PERSIS seperti job "E2E (Production
      # Build)" di playwright.yml. Alasan: 6 kegagalan beruntun (2026-09-12
      # s.d. 09-13, branch ini dan main) selalu terjadi di jendela setelah
      # warmup selesai — saat chromium diluncurkan DI ATAS server dev
      # Turbopack (kompilator on-demand, rakus memori) pada runner 7 GB,
      # dan runner dilaporkan menerima "shutdown signal" eksternal. Varian
      # produksi (next start, tanpa kompilator) memakai wrapper yang sama
      # dan bertahan >26 menit di pool yang sama tanpa pernah terbunuh.
      # Sukses job prod pada pool identik diulang eksperimen 5x sepanjang
      # 2 hari — dev mode adalah satu-satunya variabel yang membedakan.
      - name: Build (production)
        run: bun run build

      # test:e2e = workflow scripts/run-e2e.ts: memulai server dari
      # E2E_SERVER_CMD (next start produksi), memanaskan rute utama, lalu
      # menjalankan Playwright dengan reuseExistingServer aktif
      # (PW_REUSE_SERVER=1).
      # E2E_SERVER_LOG: wrapper menyalin log server ke workspace saat selesai
      # (sekali, di akhir) agar bisa di-upload saat gagal — berguna untuk
      # mendiagnosis stall cold-compile Turbopack & masalah jaringan.
      # E2E_TAIL_LINES / E2E_TAIL_LINES_ERR didefinisikan di env level
      # WORKFLOW (di atas) — step ini dan step "Check tail heading" memakai
      # nilai yang sama.
      - name: Run E2E tests (production server)
        run: bun run test:e2e
        env:
          E2E_SERVER_CMD: "bun run start"
          E2E_SERVER_LOG: ./server-e2e.log

      # Setiap mutasi API yang dilakukan spec harus dideklarasikan di pragma
      # // warmup: — membaca laporan dari fixture e2e/mutation-log.ts yang
      # ditulis saat test:e2e di atas.
      - name: Check warmup declarations
        run: bun run check:warmup-declarations

      # Sinyal kegagalan server TIDAK boleh muncul di log run hijau: response
      # 5xx (suite e2e TIDAK pernah sengaja men-trigger 5xx — semua rejection
      # path memakai 400) dan `[bos-documents] upload failed` (catch → 500;
      # beda dari "unggahan ditolak" yang merupakan 400 yang memang dites
      # spec). Memindai artifact merged (server-e2e.log + .err) yang sudah
      # ditulis wrapper; exit 1 = temuan → run GAGAL walau suite lulus.
      # if: always() — saat suite merah sekalipun, temuan 5xx tetap dilaporkan
      # ke step summary dengan pesan khas (bukan sekadar ikut merah).
      # E2E_LOG_ALLOW: regex per-baris untuk mengecualikan 5xx yang memang
      # disengaja di masa depan (mis. endpoint yang dites error path-nya).
      - name: Check server log for 5xx / upload failures
        if: always()
        run: bun run check:server-log
        env:
          E2E_SERVER_LOG: ./server-e2e.log

      # Pastikan heading step summary sesuai E2E_TAIL_LINES — menangkap
      # perubahan env var YAML tanpa mengupdate wrapper (atau sebaliknya).
      - name: Check tail heading matches E2E_TAIL_LINES
        if: failure()
        run: |
          if grep -q "server log tail ($E2E_TAIL_LINES baris stdout" "$GITHUB_STEP_SUMMARY"; then
            echo "Tail heading matches E2E_TAIL_LINES ($E2E_TAIL_LINES) ✓"
          else
            ACTUAL=$(grep -o 'server log tail ([0-9]* baris' "$GITHUB_STEP_SUMMARY" | head -1)
            echo "::error::Step summary tail heading ($ACTUAL) does not match E2E_TAIL_LINES ($E2E_TAIL_LINES)"
            exit 1
          fi

      # Triage kegagalan TIDAK perlu step terpisah — scripts/run-e2e.ts sudah
      # menjalankan scripts/triage-e2e.ts OTOMATIS saat suite gagal (verdict
      # di konsol + step summary + artifact server-e2e.log). Step terpisah
      # akan menjalankan scan yang sama dua kali.
      # Verdict triage untuk komentar PR: jalankan ulang triage --json
      # terhadap log server yang SUDAH ditulis wrapper (./server-e2e.log) dan
      # simpan hasilnya ke file — dibaca step komentar di bawah. continue-
      # on-error: triage exit 1 = ADA temuan (itu justru yang ditampilkan).
      # Scan ulang ini murah (<1s) dan tidak bergantung plumbing output antar
      # step.
      - name: Get triage verdict
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        run: bun run triage:e2e -- --json > triage-verdict.json 2>/dev/null || true
        env:
          E2E_SERVER_LOG: ./server-e2e.log

      # Verdict cold-compile / warmup-failed = cache-flake (stall kompilasi
      # on-demand / warm-up gagal diam-diam), BUKAN kegagalan nyata — step ini
      # sengaja GAGAL dengan pesan khas (exit code 42) agar rerun karena cache
      # dingin terlihat TERPISAH dari kegagalan asli (network/assertion) di UI
      # run. Verdict lain / payload tidak ada → step lulus; job sudah merah
      # dari step e2e itu sendiri.
      - name: Flag cache-flake (cold-compile / warmup-failed)
        if: failure() && github.event_name == 'pull_request'
        run: |
          node -e "
            const fs = require('fs');
            let v = null;
            try { v = JSON.parse(fs.readFileSync('triage-verdict.json', 'utf8')); } catch {}
            if (v && (v.verdict === 'cold-compile' || v.verdict === 'warmup-failed')) {
              console.error('::error::E2E gagal diklasifikasikan sebagai ' + v.verdict + ' (cache-flake) — jalankan ulang dengan cache panas sebelum menyelidiki kegagalan nyata.');
              process.exit(42);
            }
            console.log('Verdict: ' + (v ? v.verdict : 'n/a') + ' — bukan cache-flake (atau payload tidak tersedia).');
          "

      - name: Upload Playwright report on failure
        id: upload-report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: ${{ env.ARTIFACT_RETENTION_REPORT }}

      # Link LANGSUNG ke artifact playwright-report di step summary — SATU-
      # SATUNYA link report di summary (heading failure tidak lagi memuat
      # link; itu dobel dengan blok ini). Heading ditulis wrapper SEBELUM
      # upload, dan URL langsung butuh ID numerik yang baru ada sebagai
      # output upload-artifact (artifact-url), jadi link hanya bisa ditempel
      # SETELAH upload selesai — dirender di bawah section ## failure yang
      # sama (blok step summary milik step ini ditambahkan ke job summary
      # setelah blok wrapper). Fallback ke halaman artifacts bila output
      # artifact-url kosong.
      - name: Link playwright-report artifact in step summary
        if: failure()
        shell: bash
        run: |
          REPORT_URL="${{ steps.upload-report.outputs.artifact-url }}"
          if [ -z "$REPORT_URL" ]; then
            REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          fi
          {
            echo "### 🔗 Playwright report (artifact langsung)"
            echo ""
            echo "[📦 playwright-report]($REPORT_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Log server + log wrapper (warm-up statuses ✓/◇/✗, alur test:e2e) —
      # satu file untuk diagnosa cold-compile stall / network. Di-upload di
      # SEMUA run (sukses maupun gagal) agar setiap run meninggalkan jejak
      # post-mortem tanpa mengunduh artifact hanya saat failure. Retention
      # sengaja LEBIH LAMA (30 hari) daripada Playwright report (7 hari,
      # failure-only, jauh lebih besar) — trail diagnosa harus bertahan
      # lebih lama daripada laporan besar yang jarang dibuka.
      - name: Upload server log
        id: upload-server-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server-e2e.log*
          retention-days: ${{ env.ARTIFACT_RETENTION_SERVER_LOG }}

      # Riwayat statistik per run (e2e-stats.jsonl, SATU baris per run) —
      # baseline cek tren non-2xx antar run (step "Check non-2xx trend").
      # Di-upload di SEMUA run (if: always()) agar baseline selalu ada.
      - name: Upload e2e-stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stats
          path: e2e-stats.jsonl
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_SERVER_LOG }}

      # Tren non-2xx antar run: cari artifact e2e-stats dari run SEBELUMNYA
      # (workflow sama, run LAIN — bukan run ini) sebagai baseline.
      - name: Find previous e2e-stats run
        id: find-prev-stats
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, name: "e2e-stats", per_page: 100 }
            );
            const sorted = [...artifacts].sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );
            const prev = sorted.find(
              (a) => a.workflow_run && a.workflow_run.id !== context.runId
            );
            if (prev?.workflow_run?.id) {
              core.setOutput("prev_run_id", String(prev.workflow_run.id));
              console.log(`Baseline: e2e-stats dari run #${prev.workflow_run.id} (${prev.created_at}).`);
            } else {
              console.log("::notice::Belum ada e2e-stats dari run lain — run ini jadi baseline tren non-2xx.");
            }

      - name: Download previous e2e-stats
        if: steps.find-prev-stats.outputs.prev_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-stats
          run-id: ${{ steps.find-prev-stats.outputs.prev_run_id }}
          path: prev-stats

      # Alert kenaikan non-2xx diam-diam (spec baru): bandingkan run ini vs
      # baseline. Warning di step summary (section ⚠️); E2E_NON2XX_FAIL=true
      # mengubahnya jadi gate (exit 1). Baseline hilang → run ini jadi
      # baseline.
      - name: Check non-2xx trend
        run: bun run check:non2xx
        env:
          E2E_PREV_STATS: ./prev-stats/e2e-stats.jsonl

      # Guard data leak — pastikan judul E2E/AUDIT tidak bocor ke dataset
      - name: Check test data leak
        run: bun run check:data-leak

      # Stage state untuk job orphan-check: dump PostgreSQL e2e + file
      # upload BOS. Hanya file bos-*.pdf yang disalin (bukan seluruh
      # public/uploads) agar artifact kecil — check hanya peduli file BOS.
      # Dump memakai container postgres:16-alpine (pg_dump versi cocok,
      # terpasang via docker runner — bukan pg_dump bawaan runner).
      # Di-upload di SEMUA run (if: always()) konsisten dengan server log;
      # job orphan-check sendiri hanya berjalan bila suite HIJAU
      # (needs: e2e), jadi kegagalan suite tidak menambah noise "yatim".
      - name: Stage e2e state for orphan check
        if: always()
        run: |
          mkdir -p orphan-state/uploads
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U postgres -d ci_e2e --no-owner --no-privileges \
            > orphan-state/db.sql \
            || echo "pg_dump gagal — orphan-check akan melihat DB kosong"
          cp public/uploads/bos-*.pdf orphan-state/uploads/ 2>/dev/null || true

      - name: Upload e2e orphan state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-orphan-state
          path: orphan-state/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_SERVER_LOG }}

      # Komentar di PR saat e2e gagal: link langsung ke artifact Playwright
      # report & server log (merged: wrapper + server) — diagnosa tanpa
      # mencari artifact secara manual. Komentar lama bot diganti (marker),
      # jadi tidak menumpuk di retry.
      - name: Comment failure links on PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/comment-e2e-failure
        with:
          report_url: ${{ steps.upload-report.outputs.artifact-url }}
          server_log_url: ${{ steps.upload-server-log.outputs.artifact-url }}
          retention_server_log: ${{ env.ARTIFACT_RETENTION_SERVER_LOG }}
          retention_report: ${{ env.ARTIFACT_RETENTION_REPORT }}
          check_run_id: ${{ job.check_run_id }}
          marker: "<!-- e2e-failure-summary -->"
          heading: "## ❌ E2E gagal"
          sibling_marker: "<!-- e2e-failure-summary-prod -->"
          sibling_name: "E2E (Production Build)"
          label: "e2e-failed"

      # Saat PR AKHIRNYA HIJAU (retry sukses / fix di commit berikutnya),
      # komentar sticky kegagalan lama dibersihkan — green PR tidak menyisakan
      # komentar bot basi. Label e2e-failed dilepas HANYA bila workflow sibling
      # juga sudah tidak punya komentar kegagalan (PR setengah merah tetap
      # berlabel). Tidak berjalan saat suite gagal (if: success()).
      - name: Clean up failure comment on pass
        if: success() && github.event_name == 'pull_request'
        uses: ./.github/actions/cleanup-e2e-failure
        with:
          marker: "<!-- e2e-failure-summary -->"
          sibling_marker: "<!-- e2e-failure-summary-prod -->"
          label: "e2e-failed"

  # Verifikasi kebersihan disk SETELAH suite e2e, dua arah: (1) rute DELETE
  # (/api/bos-documents/[id]) harus menghapus file BOS bersama barisnya —
  # bila baris dihapus di luar aplikasi atau rute gagal menghapus file,
  # file bos-*.pdf tertinggal di public/uploads (yatim) dan tetap terlayani
  # publik; (2) kebalikannya, baris BosDocument yang file-nya hilang dari
  # disk (baris gantung) — link dokumen menjadi 404 di daftar publik. Job
  # ini menjalankan clean:orphans -- --check (report-only, TIDAK menghapus)
  # terhadap state e2e yang distage job e2e — gagal bila file yatim di luar
  # ORPHAN_EXPECT ATAU baris gantung di luar ROWS_WITHOUT_FILE_EXPECT
  # (keduanya default 0). Hanya berjalan bila suite HIJAU (needs: e2e), jadi
  # kegagalan suite tidak menambah noise "yatim" di atas merah.
  orphan-check:
    name: Check orphaned BOS files
    needs: e2e
    runs-on: ubuntu-latest
    # PostgreSQL service container — DB di-restore dari dump artifact e2e
    # (berisi baris BosDocument hasil suite) via psql di dalam container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # PrismaClient membaca DATABASE_URL saat konstruksi; DB yang
      # di-restore dari dump artifact e2e ke service container di atas.
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ci_e2e?schema=public"
      AUTH_SECRET: "ci-insecure-build-secret"
      NEXT_PUBLIC_SITE_URL: "https://sdn-mongisidi1.sch.id"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      # Checkout WAJIB sebagai step pertama sebelum action lokal —
      # runner me-resolve path ./.github/actions/* dari workspace yang
      # masih kosong tanpa checkout (bug refactor c92ca77: job gagal
      # instan "Can't find 'action.yml' under setup-repo").
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repo (Node + Bun + install)
        uses: ./.github/actions/setup-repo

      - name: Download e2e orphan state
        uses: actions/download-artifact@v4
        with:
          name: e2e-orphan-state
          path: orphan-state

      # Pulihkan DB (dump artifact → service container postgres) + uploads
      # ke lokasi yang diharapkan skrip (public/uploads), lalu jalankan
      # check. Skrip juga melaporkan BARIS BosDocument yang file-nya hilang
      # (data-integrity) — exit 1 bila jumlah baris gantung melebihi
      # ROWS_WITHOUT_FILE_EXPECT. Kedua knob bisa di-override via
      # workflow_dispatch bila suatu saat ada baseline yang disengaja.
      - name: Run orphan check
        run: |
          mkdir -p public/uploads
          cp orphan-state/uploads/* public/uploads/ 2>/dev/null || true
          docker run --rm -i --network host -e PGPASSWORD=postgres postgres:16-alpine \
            psql -h 127.0.0.1 -U postgres -d ci_e2e -v ON_ERROR_STOP=0 \
            < orphan-state/db.sql
          bun run clean:orphans -- --check
