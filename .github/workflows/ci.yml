name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      # PrismaClient membaca DATABASE_URL saat konstruksi (sitemap.ts
      # di-prerender saat build). Test unit memakai mock penuh, jadi DB
      # dummy cukup — tidak ada koneksi nyata yang dibutuhkan.
      DATABASE_URL: "file:./ci.db"
      # AUTH_SECRET tidak wajib saat build, tapi diset untuk menghindari
      # peringatan dari src/lib/auth.ts. Ganti dengan secret asli di
      # production (jangan pernah commit secret di sini).
      AUTH_SECRET: "ci-insecure-build-secret"
      NEXT_PUBLIC_SITE_URL: "https://sdn-mongisidi1.sch.id"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Lint (Markdown)
        run: bun run lint:md

      - name: Check schema sync
        run: bun run check:schema

      - name: Test (unit)
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # E2E butuh database SQLite berisi seed (admin/operator/guru, berita,
      # pengumuman, agenda) — seed dilewati bila DB sudah terisi, jadi
      # db:push lalu db:seed cukup untuk database baru per run.
      DATABASE_URL: "file:./ci-e2e.db"
      AUTH_SECRET: "ci-insecure-build-secret"
      NEXT_PUBLIC_SITE_URL: "https://sdn-mongisidi1.sch.id"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database (schema + seed)
        run: |
          bun run db:push
          bun run db:seed

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts memulai dev server sendiri di CI
      # (reuseExistingServer: !process.env.CI → false) dan menunggu :3000.
      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
