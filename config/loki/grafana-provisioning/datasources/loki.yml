# Grafana Datasource Provisioning — Loki
# Auto-configures Loki as a datasource in Grafana

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # UID eksplisit — dashboard JSON dan aturan alerting mereferensi UID ini.
    # Nilai lama dipertahankan agar dashboard provisioned yang sudah ada
    # (cms-monsa-logs.json) tetap ter-resolve.
    uid: P8E80F9AEF21F6940
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
