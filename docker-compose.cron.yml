# ============================================
# CMS MONSA - Docker Compose Cron Override
# ============================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cron.yml up -d
#
# Menambahkan service `cron` yang menjalankan:
#   - backup otomatis tiap hari 02.00 (zona waktu Asia/Makassar) via
#     busybox crond di dalam container,
#   - cron APP /api/cron/cleanup-uploads (02.30) & /api/cron/storage-alert
#     (03.00) — dipanggil via runner scripts/cron-job.sh (1 ulangan setelah
#     5 menit bila gagal + body respons dicatat ke log) ke service `app`
#     dengan header `Authorization: Bearer $CRON_SECRET`, persis semantik
#     Vercel Cron.
#     Jadi alert kuota storage & cleanup upload tetap jalan setelah migrasi
#     dari Vercel (lihat docs/MIGRATION-VERCEL-TO-SELFHOST.md §5.1).
#
# PERBAIKAN (audit deployment 2026-08-28):
#   - Sebelumnya service ini membangun image dari Dockerfile aplikasi
#     (node:20-alpine) yang TIDAK punya `pg_dump` → backup selalu gagal.
#     Kini memakai image postgres:16-alpine (pg_dump + crond + bash tersedia;
#     versi pg_dump 16 cocok dengan server postgres:16 di compose utama).
#   - Referensi service `db` → `postgres` (nama di docker-compose.yml),
#     volume `postgres_data`/`uploads_data` → tidak dipakai lagi,
#     network `cms-network` (tak pernah didefinisikan) → dihapus.
#   - Mount data-dir Postgres ke container cron DIHAPUS — dua proses di
#     data dir yang sama berisiko korupsi; pg_dump mengakses lewat jaringan.
# ============================================

services:
  cron:
    image: postgres:16-alpine
    container_name: cms-monsa-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Job wget menyasar service `app` — tunggu sehat agar job hari pertama
      # tidak gagal karena app belum listen.
      app:
        condition: service_healthy
    environment:
      # pg_dump terhubung ke service `postgres` lewat network internal.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}@postgres:5432/cms_mongisidi?schema=public
      # Token cron — WAJIB sama dengan CRON_SECRET yang diterima service app
      # (header Authorization job wget di bawah). Wajib diisi agar job
      # cleanup/alert tidak sekadar mencatat 401 di log.
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET wajib diisi di .env (sama dengan service app)}
      # Lokasi output backup (volume) & sumber uploads (volume app, read-only)
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      RETENTION: "14"
      # crond (busybox) mengikuti TZ env → jadwal 02.00 = 02.00 Asia/Makassar.
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - ./scripts/backup-db.sh:/app/scripts/backup-db.sh:ro
      # Runner job wget cron APP: 1 ulangan setelah 5 menit + log body respons
      # (lihat scripts/cron-job.sh).
      - ./scripts/cron-job.sh:/app/scripts/cron-job.sh:ro
      # Volume yang sama dengan service `app` (read-only) agar backup
      # ikut mengarsipkan upload gambar/PDF.
      - uploads-data:/uploads:ro
      - backups-data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/crontabs/root <<'EOF'
        0 2 * * * bash /app/scripts/backup-db.sh >> /backups/backup.log 2>&1
        30 2 * * * /bin/sh /app/scripts/cron-job.sh cleanup-uploads /api/cron/cleanup-uploads >> /backups/cron.log 2>&1
        0 3 * * * /bin/sh /app/scripts/cron-job.sh storage-alert /api/cron/storage-alert >> /backups/cron.log 2>&1
        EOF
        touch /backups/backup.log /backups/cron.log
        echo "[cron] backup 02.00 + cleanup-uploads 02.30 + storage-alert 03.00 ($${TZ:-Asia/Makassar})"
        crond -f -l 2

# ============================================
# Volumes
# ============================================
volumes:
  backups-data:
    driver: local
