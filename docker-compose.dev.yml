# ============================================
# CMS MONSA - Docker Compose untuk DEV LOKAL (hanya PostgreSQL)
# ============================================
# Database development lokal. Port HOST 55433 (bukan 5432) sengaja dipilih:
# banyak mesin Windows punya layanan PostgreSQL NATIVE yang menempel di
# 0.0.0.0:5432 (service "postgresql-x64-*"), sehingga koneksi 127.0.0.1:5432
# dari host bisa mendarat di server native — bukan container — dan gagal
# autentikasi (P1000) tanpa alasan yang jelas. Port tinggi menghindari
# tabrakan itu sepenuhnya.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Lalu di .env.local (root repo):
#   DATABASE_URL="postgresql://mons:mons@127.0.0.1:55433/cms_mongisidi_dev?schema=public"
#
# Setup awal (sekali):
#   bunx prisma db push          # buat skema
#   E2E_SEED=1 bunx tsx prisma/seed-e2e.ts   # data demo (ID berawalan e2e-)
#
# Hentikan (data tetap ada di volume):
#   docker compose -f docker-compose.dev.yml down
# Hentikan & hapus data dev:
#   docker compose -f docker-compose.dev.yml down -v
# ============================================

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: monsa-postgres-dev
    restart: unless-stopped
    # Bind localhost saja — database dev tidak perlu terekspos keluar.
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: cms_mongisidi_dev
      POSTGRES_USER: mons
      POSTGRES_PASSWORD: mons
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mons -d cms_mongisidi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
