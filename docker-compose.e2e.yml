# ============================================
# CMS MONSA - Local E2E Test Override (NOT for production)
# ============================================
# Menyalakan stack penuh (app + postgres + cron) di port terpisah dan dengan
# jadwal cron MENITI (bukan harian) supaya job cron terbukti berjalan secara
# live — termasuk job `always-fails` (menyasar endpoint yang tidak ada) untuk
# menguji laporan kegagalan ke /api/cron/cron-failure. Jangan pernah dipakai
# di produksi.
#
# Usage:
#   npm run e2e:selfhost    # orchestrator: up → assert → teardown
#   atau manual:
#   REDIS_URL= POSTGRES_PASSWORD=e2e-pass CRON_SECRET=e2e-cron-secret \
#     docker compose -p monsa-e2e -f docker-compose.yml -f docker-compose.cron.yml \
#     -f docker-compose.e2e.yml up -d
#
# WAJIB menyertakan docker-compose.cron.yml (service `cron` didefinisikan di
# sana; file ini hanya menimpa port/env/jadwalnya).
#
# ISOLASI: container_name sengaja DITIMPA dengan akhiran -e2e supaya stack
# uji TIDAK pernah menabrak stack produksi yang sedang berjalan di host yang
# sama (compose mempertahankan container_name apa adanya meski -p beda).
# Port juga terpisah (app 3100, postgres 55432) dan volume tercakup ke
# project `monsa-e2e` — `down -v` hanya menghapus miliknya.

services:
  postgres:
    container_name: monsa-postgres-e2e
    ports: !override ["127.0.0.1:55432:5432"]

  app:
    container_name: monsa-app-e2e
    # Tag lokal eksplisit — CI pre-build image dengan cache GHA (lihat job
    # selfhost-e2e) sehingga `up` memakai image jadi; tanpa image, compose
    # membangun dari Dockerfile (perilaku lokal).
    image: cms-monsa:e2e
    ports: !override ["127.0.0.1:3100:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}@postgres:5432/cms_mongisidi?schema=public
      AUTH_SECRET: e2e-auth-secret-not-production
      CRON_SECRET: e2e-cron-secret
      # Kuota kecil (1 MB) supaya alert bisa dilampaui dengan seed ringan.
      NEON_STORAGE_QUOTA_MB: "1"
      STORAGE_ALERT_THRESHOLD_PCT: "50"
      UPLOAD_RETENTION_DAYS: "30"
      # Kanal notifikasi uji: nilai dummy — request benar-benar dikirim ke API
      # publik (api.fonnte.com / api.telegram.org) tapi gagal 401 karena token
      # tidak valid, jadi jalur "percobaan terkirim tapi kanal gagal" terlatih
      # tanpa pesan sungguhan pernah sampai ke siapa pun.
      ADMIN_PHONE: "6281234567890"
      FONNTE_TOKEN: "e2e-dummy-fonnte-token"
      TELEGRAM_BOT_TOKEN: "123456:e2e-dummy-telegram-token"
      TELEGRAM_CHAT_ID: "-1000000000000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  cron:
    container_name: monsa-cron-e2e
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}@postgres:5432/cms_mongisidi?schema=public
      CRON_SECRET: e2e-cron-secret
      # Ulangan job 2 detik (bukan default 300) supaya job always-fails
      # menghabiskan retry + melaporkan kegagalan dalam menit yang sama —
      # terlihat oleh jendela tunggu 130 detik assert script.
      RETRY_DELAY_SEC: "2"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/crontabs/root <<'EOF'
        * * * * * bash /app/scripts/backup-db.sh >> /backups/backup.log 2>&1
        * * * * * /bin/sh /app/scripts/cron-job.sh cleanup-uploads /api/cron/cleanup-uploads >> /backups/cron.log 2>&1
        * * * * * /bin/sh /app/scripts/cron-job.sh storage-alert /api/cron/storage-alert >> /backups/cron.log 2>&1
        * * * * * /bin/sh /app/scripts/cron-job.sh always-fails /api/cron/tidak-ada >> /backups/cron.log 2>&1
        EOF
        touch /backups/backup.log /backups/cron.log
        echo "[e2e-cron] semua job tiap menit (+ always-fails untuk uji laporan kegagalan)"
        crond -f -l 2
